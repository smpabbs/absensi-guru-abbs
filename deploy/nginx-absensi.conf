# Contoh konfigurasi Nginx untuk aplikasi absensi (situs statis).
# Simpan sebagai /etc/nginx/sites-available/absensi, lalu:
#   sudo ln -s /etc/nginx/sites-available/absensi /etc/nginx/sites-enabled/absensi
#   sudo nginx -t && sudo systemctl reload nginx
# Ganti nama domain dan folder sesuai VPS Bapak.

server {
    listen 80;
    listen [::]:80;
    server_name absen.smpabbs.alabidin.sch.id;

    root /var/www/absensi;
    index index.html;

    # keamanan dasar
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # kompresi
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # halaman utama jangan di-cache (biar update langsung terlihat)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # aset sudah diberi versi (?v=…) di index.html
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # file SQL dan dokumen tidak perlu disajikan ke publik
    location ~* \.(?:sql|md|toml|yml|yaml)$ {
        return 404;
    }
}

# Setelah certbot dijalankan, Nginx akan otomatis menambahkan blok server 443
# (SSL) dan pengalihan 80 -> 443 di file ini.
