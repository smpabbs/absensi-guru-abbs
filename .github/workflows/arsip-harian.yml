name: Salin foto absensi ke Google Drive

# Menyalin foto absen yang belum terarsip ke Google Drive (project/absensi guru).
# Tidak menghapus apa pun — penghapusan dilakukan oleh arsip-final.yml di akhir periode.
# Butuh repo secret: ABSEN_CRON_SECRET (sama dengan CRON_SECRET di Supabase).

on:
  schedule:
    - cron: "30 16 * * *"   # 23:30 WIB setiap hari
  workflow_dispatch:

jobs:
  salin:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil Edge Function (arsip_harian)
        env:
          CRON_SECRET: ${{ secrets.ABSEN_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Secret ABSEN_CRON_SECRET belum diisi."; exit 1
          fi
          hasil=$(curl -sS -X POST \
            "https://lthyqvxpiykqfaqrumcx.supabase.co/functions/v1/absen" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{"action":"arsip_harian","batas":80}')
          echo "$hasil"
          echo "$hasil" | grep -q '"ok":true'
