name: Salin foto absensi ke Google Drive

# Menyalin foto absen yang belum terarsip ke Google Drive (project/absensi guru).
# Tidak menghapus apa pun — penghapusan dilakukan oleh arsip-final.yml di akhir periode.
# Butuh repo secret: ABSEN_CRON_SECRET (sama dengan CRON_SECRET di Supabase).

on:
  schedule:
    - cron: "30 16 * * *"   # 23:30 WIB setiap hari
  workflow_dispatch:

jobs:
  salin:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil Edge Function (arsip_harian, ulang sampai selesai)
        env:
          CRON_SECRET: ${{ secrets.ABSEN_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Secret ABSEN_CRON_SECRET belum diisi."; exit 1
          fi

          for putaran in 1 2 3 4 5 6 7 8; do
            hasil=$(curl -sS -X POST \
              "https://lthyqvxpiykqfaqrumcx.supabase.co/functions/v1/absen" \
              -H "Content-Type: application/json" \
              -H "x-cron-secret: $CRON_SECRET" \
              -d '{"action":"arsip_harian","batas":30}')

            echo "putaran $putaran: $hasil"
            echo "$hasil" | grep -q '"ok":true' || exit 1
            echo "$hasil" | grep -q '"lanjut":true' || break
            sleep 2
          done

      - name: Isi hadir (kebijakan) untuk hari yang terlewat
        env:
          CRON_SECRET: ${{ secrets.ABSEN_CRON_SECRET }}
        run: |
          curl -sS -X POST \
            "https://lthyqvxpiykqfaqrumcx.supabase.co/functions/v1/absen" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{"action":"isi_kebijakan"}'
