name: Deploy Cloudflare Pages

# Deploy statis ke https://absenguruabbs.pages.dev setiap push ke main.
# Project Pages memakai "Direct Upload", jadi deploy lewat wrangler dari Actions.
# Butuh repo secret: CLOUDFLARE_API_TOKEN (scope: Account > Cloudflare Pages > Edit).
# Tanpa secret, job dilewati (tidak gagal merah).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cek secret
        id: cek
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "Secret CLOUDFLARE_API_TOKEN belum diisi — deploy dilewati."
            echo "ada=no" >> "$GITHUB_OUTPUT"
          else
            echo "ada=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cek.outputs.ada == 'yes'

      - name: Siapkan folder www
        if: steps.cek.outputs.ada == 'yes'
        run: node scripts/siapkan-www.mjs

      - name: Deploy ke Cloudflare Pages
        if: steps.cek.outputs.ada == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c3f63ec30d9e7369c3f417bf17e01c54
          command: pages deploy www --project-name absenguruabbs --branch main
