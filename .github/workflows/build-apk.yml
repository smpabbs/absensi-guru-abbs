name: Build APK Android

# Membangun APK debug dari aplikasi web (dibungkus Capacitor) dan
# menerbitkannya sebagai aset rilis GitHub dengan tag "apk-latest".
# Unduhan langsung:
#   https://github.com/smpabbs/absensi-guru-abbs/releases/download/apk-latest/app-debug.apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/siapkan-www.mjs"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "config.js"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang Android SDK platform
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Pasang dependensi
        run: npm ci

      - name: Salin file situs ke www + sync Capacitor
        run: |
          npm run www
          npx cap sync android

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/absensi-guru.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/absensi-guru.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 kosong — APK memakai kunci debug acak (pemasangan berikutnya harus uninstall dulu)."
          fi

      - name: Build APK (debug)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: absensi-guru-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Terbitkan ke rilis GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK Absensi Guru ABBS
          body: |
            APK terbaru aplikasi Absensi Guru SMP ABBS.
            Dibangun otomatis dari commit ${{ github.sha }}.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          fail_on_unmatched_files: true
