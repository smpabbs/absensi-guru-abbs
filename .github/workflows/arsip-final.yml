name: Arsip periode absensi (akhir periode)

# Dijalankan setiap tanggal 21 pukul 00:30 WIB (20 pukul 17:30 UTC):
# 1) memastikan semua foto periode 21→20 yang baru selesai sudah tersalin ke Drive,
# 2) menghapus foto periode itu dari Supabase Storage (data absen tetap permanen),
# 3) mencatat periode ke tabel absen_arsip.
# Butuh repo secret: ABSEN_CRON_SECRET.

on:
  schedule:
    - cron: "30 17 20 * *"   # tanggal 20 pukul 17:30 UTC = 21 pukul 00:30 WIB
  workflow_dispatch:

jobs:
  arsipkan:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil Edge Function (arsip_final)
        env:
          CRON_SECRET: ${{ secrets.ABSEN_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Secret ABSEN_CRON_SECRET belum diisi."; exit 1
          fi
          hasil=$(curl -sS -X POST \
            "https://lthyqvxpiykqfaqrumcx.supabase.co/functions/v1/absen" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{"action":"arsip_final"}')
          echo "$hasil"
          echo "$hasil" | grep -q '"ok":true'
